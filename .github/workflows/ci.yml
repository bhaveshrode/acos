name: ACOS Merchant CI/CD Gate

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'products/merchant/**'
      - 'backend/**'
      - 'runtime/**'
      - '.github/workflows/ci.yml'

jobs:
  build-and-test:
    name: Build & Test Validation Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MERCHANT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/acos?schema=public
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/acos?schema=public

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Clients
        run: |
          npm run prisma:generate --workspace=acos-backend

      - name: Generate baseline migration (temporary)
        working-directory: backend
        run: |
          npx prisma migrate diff --help
          mkdir -p prisma/migrations/20261113120000_init
          printf 'provider = "postgresql"\n' > prisma/migrations/migration_lock.toml
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/20261113120000_init/migration.sql
          echo "===MIGRATION-SQL-START==="
          cat prisma/migrations/20261113120000_init/migration.sql
          echo "===MIGRATION-SQL-END==="

      - name: Run Database Migrations
        working-directory: backend
        run: |
          npx prisma migrate deploy

      - name: Build Merchant
        run: |
          # The kernel build now compiles the adapters and application entry points,
          # so the hand-compiled PaymentSerializer step is no longer needed.
          npm run build --workspace=acos-merchant

      - name: Run ACOS Merchant Spec Suites
        run: |
          npm run test --workspace=acos-merchant

  kernel:
    name: Kernel Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Clients
        run: |
          npm run prisma:generate --workspace=acos-backend

      - name: Build Kernel
        run: |
          npm run build --workspace=acos-backend

      - name: Run Kernel Spec Suites
        run: |
          npm run test:kernel --workspace=acos-backend

      - name: Run Runtime Spec Suite
        run: |
          npm run test --workspace=acos-runtime

      - name: Run Admin Console Spec Suites
        run: |
          npm run test --workspace=acos-admin-console

      - name: Full backend typecheck
        working-directory: backend
        run: |
          npx tsc --noEmit -p tsconfig.json
